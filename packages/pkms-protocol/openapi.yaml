openapi: 3.1.0
info:
  title: PKMS Cloud API
  version: 1.0.0
  description: Language-neutral API contract shared by PKMS web and native clients.
servers:
  - url: https://pkms.example.com
security:
  - sessionCookie: []
  - sessionBearer: []
paths:
  /api/health:
    get:
      operationId: getHealth
      security: []
      responses:
        '200': { description: Service health and protocol version. }
  /api/session:
    get:
      operationId: getSession
      security: []
      responses:
        '200':
          description: Current session, or null when signed out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
  /api/auth/github:
    get:
      operationId: beginGitHubLogin
      security: []
      responses:
        '302':
          description: Redirects to GitHub authorization.
  /api/auth/github/callback:
    get:
      operationId: finishGitHubLogin
      security: []
      parameters:
        - in: query
          name: code
          required: true
          schema: { type: string }
        - in: query
          name: state
          required: true
          schema: { type: string }
      responses:
        '302':
          description: Establishes a secure session and redirects to the application.
  /api/auth/device/start:
    post:
      operationId: startGitHubDeviceLogin
      security: []
      responses:
        '200':
          description: GitHub Device Flow instructions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceStart' }
  /api/auth/device/poll:
    post:
      operationId: pollGitHubDeviceLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceCode]
              properties: { deviceCode: { type: string } }
      responses:
        '200':
          description: Device login completed and returned a signed PKMS token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevicePollResponse' }
        '202':
          description: User authorization is still pending.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevicePollResponse' }
  /api/logout:
    post:
      operationId: logout
      responses:
        '204': { description: Session cleared. }
  /api/repositories:
    get:
      operationId: listRepositories
      responses:
        '200':
          description: Repositories accessible to the signed-in user.
          content:
            application/json:
              schema:
                type: object
                required: [repositories]
                properties:
                  repositories:
                    type: array
                    items: { $ref: '#/components/schemas/Repository' }
  /api/workspaces:
    get:
      operationId: listWorkspaces
      responses:
        '200':
          description: Connected repository workspaces.
          content:
            application/json:
              schema:
                type: object
                required: [workspaces]
                properties:
                  workspaces:
                    type: array
                    items: { $ref: '#/components/schemas/Workspace' }
    post:
      operationId: connectWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repository, branch]
              properties:
                repository: { type: string, description: owner/name }
                branch: { type: string }
      responses:
        '201':
          description: Workspace connected and initial repository tree imported.
          content:
            application/json:
              schema:
                type: object
                required: [workspace]
                properties: { workspace: { $ref: '#/components/schemas/Workspace' } }
  /api/workspaces/{workspaceId}/snapshot:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: getWorkspaceSnapshot
      parameters:
        - in: query
          name: afterRevision
          schema: { type: integer, minimum: 0 }
          description: If present, returns changes after this revision instead of a full tree.
      responses:
        '200':
          description: Full workspace snapshot. afterRevision is reserved for a future incremental change page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceSnapshot' }
  /api/workspaces/{workspaceId}/files/{fileId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - in: path
        name: fileId
        required: true
        schema: { type: string }
    get:
      operationId: getFile
      responses:
        '200':
          description: File metadata and current materialized content.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileRecord' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/workspaces/{workspaceId}/assets/{fileId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - in: path
        name: fileId
        required: true
        schema: { type: string }
    get:
      operationId: downloadAsset
      responses:
        '200':
          description: Authenticated attachment bytes.
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/workspaces/{workspaceId}/upload:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      operationId: uploadAsset
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [path, file]
              properties:
                path: { type: string }
                clientId: { type: string }
                file: { type: string, format: binary }
      responses:
        '201': { description: Attachment stored and queued for GitHub commit. }
        '413': { description: Upload exceeds the 50 MiB limit. }
  /api/workspaces/{workspaceId}/operations:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      operationId: applyFileOperation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperationRequest' }
      responses:
        '200':
          description: Operation accepted or previously accepted (idempotent replay).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationResponse' }
        '409':
          description: Operation conflicts with current workspace state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/workspaces/{workspaceId}/files/{fileId}/updates:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - in: path
        name: fileId
        required: true
        schema: { type: string }
    get:
      operationId: getDocumentState
      parameters:
        - in: query
          name: stateVector
          schema: { type: string, contentEncoding: base64 }
      responses:
        '200':
          description: Yjs/Yrs v1 encoded state update for the requested state vector.
          content:
            application/json:
              schema:
                type: object
                required: [fileId, update, protocolVersion]
                properties:
                  fileId: { type: string }
                  update: { type: string, contentEncoding: base64 }
                  protocolVersion: { type: integer, const: 1 }
    post:
      operationId: submitDocumentUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentUpdateRequest' }
      responses:
        '200':
          description: Update persisted and broadcast to connected collaborators.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationResponse' }
  /api/workspaces/{workspaceId}/sync-status:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: getGitHubSyncStatus
      responses:
        '200':
          description: Latest server revision and GitHub commit status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncStatus' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-pkms_session
    sessionBearer:
      type: http
      scheme: bearer
      bearerFormat: PKMS-HMAC
  parameters:
    WorkspaceId:
      in: path
      name: workspaceId
      required: true
      schema: { type: string }
  responses:
    NotFound:
      description: Resource does not exist or is not accessible to this user.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    DeviceStart:
      type: object
      required: [device_code, user_code, verification_uri, expires_in, interval]
      properties:
        device_code: { type: string }
        user_code: { type: string }
        verification_uri: { type: string, format: uri }
        expires_in: { type: integer }
        interval: { type: integer }
    DevicePollResponse:
      type: object
      required: [pending]
      properties:
        pending: { type: boolean }
        interval: { type: integer }
        token: { type: string }
        user: { $ref: '#/components/schemas/User' }
        expiresAt: { type: integer, description: Unix epoch milliseconds. }
    SessionResponse:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - { $ref: '#/components/schemas/User' }
            - { type: 'null' }
    User:
      type: object
      required: [login]
      properties:
        login: { type: string }
        avatarUrl: { type: string, format: uri }
    Repository:
      type: object
      required: [fullName, defaultBranch, private, canWrite]
      properties:
        fullName: { type: string }
        defaultBranch: { type: string }
        private: { type: boolean }
        canWrite: { type: boolean }
    Workspace:
      type: object
      required: [id, repository, branch, revision, githubStatus]
      properties:
        id: { type: string }
        repository: { type: string }
        branch: { type: string }
        revision: { type: integer, minimum: 0 }
        githubStatus: { type: string, enum: [synced, pending, failed, external-change] }
        message: { type: string }
        lastGitHubCommitAt: { type: string, format: date-time }
    FileRecord:
      type: object
      required: [id, path, kind, revision]
      properties:
        id: { type: string }
        path: { type: string }
        kind: { type: string, enum: [markdown, asset, folder] }
        revision: { type: integer, minimum: 0 }
        content: { type: string, description: UTF-8 Markdown for text files. }
        contentType: { type: string }
        size: { type: integer, minimum: 0 }
        sha256: { type: string }
    WorkspaceSnapshot:
      type: object
      required: [workspaceId, revision, files, hasMore]
      properties:
        workspaceId: { type: string }
        revision: { type: integer, minimum: 0 }
        files:
          type: array
          items: { $ref: '#/components/schemas/FileRecord' }
        hasMore: { type: boolean }
        nextRevision: { type: integer, minimum: 0 }
        afterRevision: { type: integer, minimum: 0 }
    OperationRequest:
      type: object
      required: [operationId, baseRevision, clientId, operation]
      properties:
        operationId: { type: string, format: uuid }
        baseRevision: { type: integer, minimum: 0 }
        clientId: { type: string }
        operation:
          oneOf:
            - type: object
              required: [type, path]
              properties:
                type: { const: create-folder }
                path: { type: string }
            - type: object
              required: [type, path, fileId]
              properties:
                type: { const: create-file }
                path: { type: string }
                fileId: { type: string }
                content: { type: string }
            - type: object
              required: [type, fileId, toPath]
              properties:
                type: { const: move }
                fileId: { type: string }
                toPath: { type: string }
            - type: object
              required: [type, fileId]
              properties:
                type: { const: delete }
                fileId: { type: string }
    DocumentUpdateRequest:
      type: object
      required: [operationId, fileId, update]
      properties:
        operationId: { type: string, format: uuid }
        fileId: { type: string }
        update: { type: string, contentEncoding: base64 }
    OperationResponse:
      type: object
      required: [operationId, acceptedRevision, duplicate]
      properties:
        operationId: { type: string, format: uuid }
        acceptedRevision: { type: integer, minimum: 0 }
        duplicate: { type: boolean }
        conflictCopyPath: { type: string }
        rebasedFrom: { type: integer, minimum: 0 }
    SyncStatus:
      type: object
      required: [serverRevision, githubStatus, pendingFiles]
      properties:
        serverRevision: { type: integer, minimum: 0 }
        githubStatus: { type: string, enum: [synced, pending, failed, external-change] }
        githubHead: { type: string }
        lastGitHubCommitAt: { type: string, format: date-time }
        nextGitHubFlushAt: { type: integer, description: Unix epoch milliseconds. }
        pendingFiles: { type: integer, minimum: 0 }
        message: { type: string }
    ApiError:
      type: object
      properties:
        error: { type: string }
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
        currentRevision: { type: integer }
        conflictCopyPath: { type: string }
        maxBytes: { type: integer }
        retryAfterSeconds: { type: integer }
        requiredScope: { type: string }
      additionalProperties: true
