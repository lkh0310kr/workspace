[package]
name = "workspace-core"
version = "0.1.0"
edition = "2024"

[dependencies]
portable-pty = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8.2.0"

[features]
default = []
gpu-terminal = ["dep:terminal-gpu"]

[dependencies.terminal-gpu]
package = "terminal-gpu"
path = "../terminal-gpu"
optional = true
