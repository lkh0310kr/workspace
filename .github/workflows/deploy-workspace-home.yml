name: Deploy Workspace Home

on:
  push:
    branches: [main]
    paths:
      - "apps/workspace-server/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-workspace-home.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-workspace-home
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run workspace:server:typecheck
      - run: npx wrangler d1 migrations apply workspace-home --remote --config apps/workspace-server/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ff0bd6a425dcd9b7b348d3db0dec6448
      - run: npx wrangler deploy --config apps/workspace-server/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ff0bd6a425dcd9b7b348d3db0dec6448
