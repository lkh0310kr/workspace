name: Build Workspace Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Existing app version to build (for example 0.1.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/workspace-app/package-lock.json
      - name: Install repository workspace dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install desktop dependencies
        run: npm install --prefix apps/workspace-app --workspaces=false --ignore-scripts --no-audit --no-fund
      - name: Prepare Electron and native modules
        run: |
          node scripts/apply-xterm-patch.mjs
          node node_modules/electron/install.js
          npx electron-builder install-app-deps
          node scripts/fix-native-exec-bits.mjs
        working-directory: apps/workspace-app
      - name: Verify release tag matches app version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $appVersion = node -p "require('./apps/workspace-app/package.json').version"
          $releaseTag = if ($env:INPUT_VERSION) { "v$env:INPUT_VERSION" } else { $env:GITHUB_REF_NAME }
          if ($releaseTag -ne "v$appVersion") {
            throw "Release tag $releaseTag does not match app version $appVersion"
          }
      - name: Build Windows installer and update metadata
        run: npm run release:win --prefix apps/workspace-app
      - name: Upload Windows installer and update metadata to the draft release
        shell: pwsh
        working-directory: apps/workspace-app
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $releaseTag = if ($env:INPUT_VERSION) { "v$env:INPUT_VERSION" } else { $env:GITHUB_REF_NAME }
          $assets = Get-ChildItem -Path dist -File | Where-Object {
            $_.Name -like '*.exe' -or $_.Name -like '*.blockmap' -or $_.Name -eq 'latest.yml'
          } | ForEach-Object { $_.FullName }
          if (-not ($assets | Where-Object { $_ -like '*latest.yml' })) {
            throw 'Windows update metadata latest.yml was not generated'
          }
          gh release upload $releaseTag $assets --repo lkh0310kr/workspace --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
