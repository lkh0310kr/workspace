<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>engine-stream-poc — World Engine Track B feasibility spike</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        background: #111;
        color: #eee;
        margin: 0;
        padding: 24px;
      }
      h1 {
        font-size: 1.1em;
        color: #9cf;
      }
      video {
        display: block;
        width: 100%;
        max-width: 720px;
        background: #000;
        border: 1px solid #333;
        margin-top: 12px;
      }
      #status {
        font-family: ui-monospace, monospace;
        font-size: 0.85em;
        color: #8f8;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>engine-stream-poc — Rust → WebRTC → browser (World Engine Track B spike)</h1>
    <div id="status">connecting…</div>
    <video id="remoteVideo" autoplay playsinline></video>

    <script>
      const statusEl = document.getElementById("status");
      const log = (line) => {
        statusEl.textContent += `\n${line}`;
        console.log(line);
      };

      async function start() {
        const pc = new RTCPeerConnection({
          iceServers: [{ urls: "stun:stun.l.google.com:19302" }],
        });

        pc.ontrack = (event) => {
          log(`ontrack: received ${event.track.kind} track`);
          const video = document.getElementById("remoteVideo");
          if (video.srcObject !== event.streams[0]) {
            video.srcObject = event.streams[0];
          }
        };

        pc.oniceconnectionstatechange = () => {
          log(`ICE connection state: ${pc.iceConnectionState}`);
        };
        pc.onconnectionstatechange = () => {
          log(`Peer connection state: ${pc.connectionState}`);
        };

        // Receive-only video — this spike is one-directional (Rust -> browser).
        pc.addTransceiver("video", { direction: "recvonly" });

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        // Non-trickle: wait for ICE gathering to finish so the single POST
        // carries a complete offer, matching the Rust side's own
        // non-trickle answer.
        await new Promise((resolve) => {
          if (pc.iceGatheringState === "complete") {
            resolve();
            return;
          }
          pc.onicegatheringstatechange = () => {
            if (pc.iceGatheringState === "complete") resolve();
          };
        });

        log("POSTing offer to http://127.0.0.1:8787/offer …");
        const response = await fetch("http://127.0.0.1:8787/offer", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(pc.localDescription),
        });
        const answer = await response.json();
        if (answer.error) {
          log(`server error: ${answer.error}`);
          return;
        }
        await pc.setRemoteDescription(answer);
        log("Remote description set — waiting for media…");
      }

      start().catch((err) => log(`fatal: ${err}`));
    </script>
  </body>
</html>
