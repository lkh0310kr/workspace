[package]
name = "world-engine-qt-shell"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
wgpu = "30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.33", features = ["bytemuck"] }
raw-window-handle = "0.6"
rapier3d = "0.35"
hecs = "0.11"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gltf = "1"

[build-dependencies]
cc = "1"
