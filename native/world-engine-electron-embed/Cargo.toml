[package]
name = "world-engine-electron-embed"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
wgpu = "30"
raw-window-handle = "0.6"
rapier3d = "0.35"
hecs = "0.11"
glam = { version = "0.33", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
anyhow = "1"

[build-dependencies]
napi-build = "2"
