[package]
name = "world-engine-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "world_engine_core"
path = "src/lib.rs"

[dependencies]
wgpu = "30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.33", features = ["bytemuck"] }
raw-window-handle = "0.6"
rapier3d = "0.35"
hecs = "0.11"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gltf = "1"
