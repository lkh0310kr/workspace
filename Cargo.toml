[workspace]
resolver = "2"
members = [".", "crates/workspace-core", "crates/terminal-gpu"]

[package]
name = "workspace-app"
version = "0.1.0"
description = "Workspace — terminal, editor, browser"
edition = "2024"

[lib]
name = "workspace_app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "workspace-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
workspace-core = { path = "crates/workspace-core" }
tauri = { version = "2", features = ["unstable", "devtools", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
parking_lot = "0.12"
notify = "8.2.0"
url = "2"
tauri-plugin-opener = "2"
raw-window-handle = "0.6"
tauri-plugin-dialog = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
