[[permission]]
identifier = "allow-workspace"
description = "Workspace PTY, files, and browser commands."
commands.allow = [
    "get_workspace_state",
    "pty_write",
    "pty_resize",
    "spawn_terminal",
    "add_tab",
    "close_tab",
    "select_tab",
    "set_tab_layout",
    "set_tab_root_path",
    "list_dir",
    "read_file",
    "write_file",
    "browser_report_frame",
    "browser_navigate",
    "browser_back",
    "browser_forward",
    "browser_reload",
    "browser_toggle_devtools",
    "browser_hide_all",
    "browser_detach",
    "browser_cleanup_all",
    "cef_report_frame",
    "cef_navigate",
    "cef_back",
    "cef_forward",
    "cef_reload",
    "cef_toggle_devtools",
    "cef_close_pane",
    "cef_hide_pane",
    "cef_hide_all",
    "cef_cleanup_all",
]
