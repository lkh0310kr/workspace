[[permission]]
identifier = "allow-workspace"
description = "Workspace PTY, files, and browser commands."
commands.allow = [
    "get_workspace_state",
    "debug_log",
    "hostname",
    "claude_code_usage_recent",
    "claude_rate_limit_status",
    "pty_write",
    "pty_resize",
    "spawn_terminal",
    "add_tab",
    "close_tab",
    "select_tab",
    "set_tab_layout",
    "set_tab_root_path",
    "list_dir",
    "read_file",
    "write_file",
    "create_dir",
    "delete_path",
    "rename_path",
    "browser_report_frame",
    "browser_navigate",
    "browser_back",
    "browser_forward",
    "browser_reload",
    "browser_toggle_devtools",
    "browser_hide_all",
    "browser_detach",
    "browser_cleanup_all",
]
